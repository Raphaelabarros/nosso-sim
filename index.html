<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E5B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="R&amp;R Nosso Sim">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>R&amp;R Nosso Sim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de celular (máx. 560px), cabeçalho fixo no topo e barra de abas embaixo; folhas (bottom sheets) para editar */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#1C2A26; --muted:#5B6C66; --line:#DAE2DE; --soft:#E5EDE9;
  --primary:#2E5B4F; --primary-ink:#FFFFFF; --accent:#A27C34; --accent-soft:#F3EBDA;
  --ok:#2C7A4B; --ok-soft:#DFF0E5; --warn:#A8701A; --warn-soft:#F6EAD4; --bad:#B03F38; --bad-soft:#F6E1DF;
  --shadow:0 1px 2px rgba(20,40,34,.06),0 4px 14px rgba(20,40,34,.06);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#19221F; --ink:#E6EDE9; --muted:#97A9A2; --line:#2A3632; --soft:#202D29;
  --primary:#86BFAE; --primary-ink:#0E1916; --accent:#D8B66E; --accent-soft:#3A3122;
  --ok:#6BC28F; --ok-soft:#1D3527; --warn:#E0A957; --warn-soft:#3A2E1A; --bad:#E5847C; --bad-soft:#3D2220;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#19221F; --ink:#E6EDE9; --muted:#97A9A2; --line:#2A3632; --soft:#202D29;
  --primary:#86BFAE; --primary-ink:#0E1916; --accent:#D8B66E; --accent-soft:#3A3122;
  --ok:#6BC28F; --ok-soft:#1D3527; --warn:#E0A957; --warn-soft:#3A2E1A; --bad:#E5847C; --bad-soft:#3D2220;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:0 calc(90px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
header.top h1{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0;flex:1;letter-spacing:.2px;line-height:1.1}
header.top h1 .amp{font-style:italic;color:var(--accent)}
.syncbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.back{border:0;background:none;font-size:22px;padding:0 4px;color:var(--primary)}
h2.sec{font-family:var(--f-display);font-size:22px;font-weight:600;margin:22px 0 8px;text-wrap:balance}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.right{text-align:right}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Hero */
.hero{border-radius:18px;padding:20px 18px;background:var(--primary);color:var(--primary-ink);position:relative;overflow:hidden}
.hero .names{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.05}
.hero .names i{color:var(--accent-soft);font-weight:500}
:root[data-theme="dark"] .hero .names i{color:var(--accent)}
.hero .when{margin-top:6px;font-size:14px;opacity:.9}
.hero .count{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.hero .count b{font-family:var(--f-display);font-size:56px;line-height:.9;font-weight:600}
.hero .ring{position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;border:14px solid currentColor;opacity:.09}
.hero .ring.b{right:24px;top:30px;width:110px;height:110px;border-width:10px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile .v{font-weight:700;font-size:16px;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.accent>i{background:var(--accent)}

/* Lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);min-height:52px}
.li:first-child{border-top:0}
.li.tap{cursor:pointer}
.li.tap:active{background:var(--soft)}
.li .t{font-weight:600}
.grouphead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 2px 6px}
.grouphead .g{font-family:var(--f-display);font-size:20px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;border:0;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-mute{background:var(--soft);color:var(--muted)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0;color:var(--primary-ink)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.mid{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chk svg{width:14px;height:14px}
.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.ic{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px;flex:none;display:grid;place-items:center}
.ic svg{width:18px;height:18px}

/* Segmented, chips, search */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-top:10px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--primary)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:24;width:54px;height:54px;border-radius:18px;border:0;
  background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media (min-width:640px){.fab{right:calc(50% - 280px + 4px)}}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--f-display);font-size:24px;margin:0 0 12px;font-weight:600}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.f textarea{min-height:80px;resize:vertical}
.f.cb{flex-direction:row;align-items:center;gap:10px}
.f.cb input{width:22px;height:22px;accent-color:var(--primary)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--primary);color:var(--primary-ink)}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;max-width:90vw}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
a{color:var(--primary)}
.menu .li svg{width:20px;height:20px;color:var(--primary);flex:none}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.sizes div{background:var(--soft);border-radius:10px;padding:6px;text-align:center}
.sizes b{display:block;font-size:17px}
.day{border-left:3px solid var(--accent);padding-left:12px}
.pre{white-space:pre-wrap}
.best{outline:2px solid var(--ok);outline-offset:-2px}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <button class="back" id="backBtn" hidden aria-label="Voltar">‹</button>
    <h1 id="ttl"><span class="amp">R&amp;R</span> Nosso Sim</h1>
    <button class="syncbtn" id="syncBtn" type="button"><span class="dot" id="syncDot"></span><span id="syncTxt">Local</span></button>
  </header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" hidden aria-label="Adicionar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheetRoot"></div>

<script>
(()=>{
"use strict";
const KEY='nossosim:dados', KCFG='nossosim:sync', KTAB='nossosim:ui';
const COLS=['itens','convidados','padrinhos','cortejo','checklist','orcamentos','contratados','notas','voos','luaCustos','luaOrcamentos','roteiro'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const brl=v=>(v==null||isNaN(v))?'—':v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brl0=v=>(v==null||isNaN(v))?'—':'R$ '+Math.round(v).toLocaleString('pt-BR');
const parseMoney=s=>{if(s==null)return null;s=String(s).trim().replace(/[R$\s]/g,'');if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?null:Math.round(n*100)/100};
const fmtMoneyIn=v=>v==null?'':String(v).replace('.',',');
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesLabel=m=>{if(!m)return'Sem mês';const[y,mm]=m.split('-');return MESES[+mm-1]+'/'+y.slice(2)};
const mesLongo=m=>{if(!m)return'Sem mês';const[y,mm]=m.split('-');return['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][+mm-1]+' '+y};
const thisMonth=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const fmtDate=d=>{if(!d)return'';const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+y};
const fmtDay=d=>{if(!d)return'';const dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})};
const ICON={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 money:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M7 9v.01M17 15v.01"/>',
 people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.3A5 5 0 0 1 21 19"/>',
 check:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',
 more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
 store:'<path d="M4 9l1.5-5h13L20 9M4 9h16v11H4zM4 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3"/>',
 ring:'<circle cx="12" cy="14" r="6"/><path d="M9 4h6l-3 4z"/>',
 plane:'<path d="M2 16l20-7-3-2-8 3-5-4-2 1 3 5-4 1z"/><path d="M3 21h18"/>',
 note:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/>',
 heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
 cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
 up:'<path d="M12 19V5M6 11l6-6 6 6"/>',
 down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
 tick:'<path d="M5 12l4 4 10-10"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const svg=(n,sw=1.9)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- Dados ---------- */
function emptyData(){const d={versao:1,config:{noiva:'',noivo:'',data:'',localCerimonia:'',localFesta:'',orcamento:null,convidadosContratados:null,valorConvidadoExtra:null,cidade:'',maeNoiva:'',paiNoiva:'',maeNoivo:'',paiNoivo:'',updatedAt:'1970-01-01T00:00:00.000Z'},excluidos:{}};COLS.forEach(c=>d[c]=[]);return d}
function normalize(d){const e=emptyData();d=d&&typeof d==='object'?d:{};const o={...e,...d};o.config={...e.config,...(d.config||{})};o.excluidos=d.excluidos||{};COLS.forEach(c=>{o[c]=Array.isArray(d[c])?d[c]:[]});return o}
let S;
{const raw=ls.get(KEY);if(raw){try{S=normalize(JSON.parse(raw))}catch(e){S=null}}
 if(!S){S=normalize(window.SEED||null);if(window.SEED)ls.set(KEY,JSON.stringify(S))}}
const isEmpty=()=>COLS.every(c=>!S[c].length)&&!S.config.noiva;
function save(){S.atualizadoEm=now();ls.set(KEY,JSON.stringify(S));Sync.schedule()}
function touch(r){r.updatedAt=now();return r}
function addRec(col,r){r.id=r.id||uid();touch(r);S[col].push(r);save();return r}
function delRec(col,id){S[col]=S[col].filter(r=>r.id!==id);S.excluidos[id]=now();save()}
function findRec(col,id){return S[col].find(r=>r.id===id)}

function merge(a,b){
  a=normalize(a);b=normalize(b);const o=emptyData();
  const ex={...a.excluidos};for(const[k,v]of Object.entries(b.excluidos))if(!ex[k]||v>ex[k])ex[k]=v;o.excluidos=ex;
  o.config=(b.config.updatedAt||'')>(a.config.updatedAt||'')?b.config:a.config;
  for(const c of COLS){const m=new Map();
    for(const r of a[c])m.set(r.id,r);
    for(const r of b[c]){const x=m.get(r.id);if(!x||(r.updatedAt||'')>(x.updatedAt||''))m.set(r.id,r)}
    o[c]=[...m.values()].filter(r=>!ex[r.id])}
  o.atualizadoEm=[a.atualizadoEm||'',b.atualizadoEm||''].sort().pop();
  return o}
const canon=d=>JSON.stringify(COLS.map(c=>d[c]))+JSON.stringify(d.config)+JSON.stringify(Object.keys(d.excluidos).sort());

/* ---------- Sincronização GitHub ---------- */
const Sync={cfg:null,state:'off',msg:'Local',timer:null,busy:false,again:false,last:null,
  load(){try{this.cfg=JSON.parse(ls.get(KCFG)||'null')}catch(e){this.cfg=null}this.state=this.cfg?'idle':'off';this.paint()},
  saveCfg(c){this.cfg=c;if(c)ls.set(KCFG,JSON.stringify(c));else ls.del(KCFG);this.state=c?'idle':'off';this.paint()},
  paint(){const d=$('#syncDot'),t=$('#syncTxt');if(!d)return;d.className='dot '+({ok:'ok',busy:'warn',err:'bad',pend:'warn'}[this.state]||'');
    t.textContent=this.state==='off'?'Local':this.state==='busy'?'Sincronizando':this.state==='err'?'Erro':this.state==='pend'?'Pendente':'Sincronizado'},
  schedule(){if(!this.cfg)return;this.state='pend';this.paint();clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(),1500)},
  api(path,opt={}){const c=this.cfg;return fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path?'/'+path:''}`,{...opt,cache:'no-store',headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}})},
  b64e(s){const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)},
  b64d(s){const x=atob(s.replace(/\n/g,''));const b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return new TextDecoder().decode(b)},
  async pull(){const c=this.cfg;const r=await this.api(`contents/${c.path||'dados.json'}?ref=${encodeURIComponent(c.branch||'main')}`);
    if(r.status===404){const rr=await this.api('');if(rr.status===404)throw new Error('Repositório não encontrado. Confira o usuário, o nome do repositório e se o token dá acesso a ele.');return{data:null,sha:null}}
    if(r.status===401)throw new Error('Token inválido ou vencido. Gere um novo token no GitHub.');
    if(!r.ok)throw new Error('GitHub respondeu '+r.status+'.');
    const j=await r.json();let content=j.content;
    if(!content&&j.git_url){const b=await fetch(j.git_url,{headers:{'Authorization':'Bearer '+c.token}});content=(await b.json()).content}
    return{data:JSON.parse(this.b64d(content)),sha:j.sha}},
  async push(data,sha){const c=this.cfg;const body={message:'Atualiza dados do casamento',content:this.b64e(JSON.stringify(data,null,1)),branch:c.branch||'main'};if(sha)body.sha=sha;
    const r=await this.api(`contents/${c.path||'dados.json'}`,{method:'PUT',body:JSON.stringify(body)});
    if(r.status===409||r.status===422)return false;
    if(r.status===403||r.status===404)throw new Error('O token não tem permissão de escrita. No token, mude "Contents" para "Read and write".');
    if(!r.ok)throw new Error('Falha ao gravar ('+r.status+').');return true},
  async run(manual){if(!this.cfg)return;if(this.busy){this.again=true;return}
    if(!navigator.onLine){this.state='pend';this.msg='Sem internet. Sincroniza quando voltar.';this.paint();return}
    this.busy=true;this.state='busy';this.paint();
    try{for(let i=0;i<3;i++){const{data,sha}=await this.pull();const merged=data?merge(S,data):S;
        const changedLocal=canon(merged)!==canon(S);const changedRemote=!data||canon(merged)!==canon(normalize(data));
        if(changedLocal){S=merged;ls.set(KEY,JSON.stringify(S));render()}
        if(changedRemote){if(!(await this.push(merged,sha)))continue}
        break}
      this.state='ok';this.last=new Date();this.msg='Sincronizado às '+this.last.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(manual)toast('Sincronizado')}
    catch(e){this.state='err';this.msg=e.message||String(e);if(manual)toast(this.msg)}
    finally{this.busy=false;this.paint();if(route==='sync')render();if(this.again){this.again=false;this.schedule()}}}
};

/* fields: [{k,l,t:'text|money|number|select|date|month|time|textarea|cb|url|tel',o:[...],half}] */
function form({title,fields,rec={},onSave,onDelete,extra=''}){
  const fh=f=>{const v=rec[f.k];const id='f_'+f.k;
    if(f.t==='cb')return`<div class="f cb"><input type="checkbox" id="${id}" ${v?'checked':''}><label for="${id}" style="font-size:14px;color:var(--ink)">${esc(f.l)}</label></div>`;
    let inp;
    if(f.t==='select')inp=`<select id="${id}">${f.o.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}" ${String(v??'')===String(val)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
    else if(f.t==='textarea')inp=`<textarea id="${id}">${esc(v)}</textarea>`;
    else if(f.t==='money')inp=`<input id="${id}" inputmode="decimal" placeholder="0,00" value="${esc(fmtMoneyIn(v))}">`;
    else{const ty={number:'number',date:'date',month:'month',time:'time',url:'url',tel:'tel'}[f.t]||'text';inp=`<input id="${id}" type="${ty}" ${f.t==='number'?'inputmode="numeric"':''} value="${esc(v)}" ${f.list?`list="dl_${f.k}"`:''}>`+(f.list?`<datalist id="dl_${f.k}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:'')}
    return`<div class="f"><label for="${id}">${esc(f.l)}</label>${inp}</div>`};
  let body='',half=[];
  const flush=()=>{if(half.length){body+=`<div class="f2">${half.join('')}</div>`;half=[]}};
  fields.forEach(f=>{if(f.half){half.push(fh(f));if(half.length===2)flush()}else{flush();body+=fh(f)}});flush();
  sheet(`<h3>${esc(title)}</h3><form id="frm">${body}${extra}<div class="btns"><button class="btn" type="submit">Salvar</button><button class="btn sec" type="button" id="cancel">Cancelar</button>${onDelete?'<button class="btn danger" type="button" id="del" style="margin-left:auto">Excluir</button>':''}</div><div id="cfm"></div></form>`,()=>{
    $('#cancel').onclick=closeSheet;
    $('#frm').onsubmit=e=>{e.preventDefault();const out={};fields.forEach(f=>{const el=$('#f_'+f.k);
      out[f.k]=f.t==='cb'?el.checked:f.t==='money'?parseMoney(el.value):f.t==='number'?(el.value===''?null:Number(el.value)):el.value.trim()});
      onSave(out);closeSheet();render()};
    if(onDelete)$('#del').onclick=()=>{$('#cfm').innerHTML=`<div class="confirm">Excluir de vez? <div class="btns"><button class="btn danger sm" type="button" id="del2">Sim, excluir</button><button class="btn sec sm" type="button" id="del3">Não</button></div></div>`;
      $('#del2').onclick=()=>{onDelete();closeSheet();render();toast('Excluído')};$('#del3').onclick=()=>$('#cfm').innerHTML=''};
  })}

const notaFields=[{k:'titulo',l:'Título'},{k:'texto',l:'Texto',t:'textarea'}];

function vDados(v){const c=S.config;
  const fields=[{k:'noiva',l:'Noiva',half:1},{k:'noivo',l:'Noivo',half:1},{k:'data',l:'Data do casamento',t:'date',half:1},{k:'cidade',l:'Cidade',half:1},{k:'localCerimonia',l:'Local da cerimônia'},{k:'localFesta',l:'Local da festa'},{k:'orcamento',l:'Orçamento total',t:'money',half:1},{k:'convidadosContratados',l:'Convidados contratados',t:'number',half:1},{k:'valorConvidadoExtra',l:'Valor por convidado extra',t:'money',half:1},{k:'nPadrinhos',l:'Nº de padrinhos',t:'number',half:1},{k:'maeNoiva',l:'Mãe da noiva',half:1},{k:'paiNoiva',l:'Pai da noiva',half:1},{k:'maeNoivo',l:'Mãe do noivo',half:1},{k:'paiNoivo',l:'Pai do noivo',half:1}];
  v.innerHTML=`<div class="card" style="margin-top:6px"><dl class="kv">${fields.map(f=>{let val=c[f.k];if(f.t==='money')val=val!=null?brl(val):'';if(f.t==='date')val=fmtDate(val);return`<dt>${f.l}</dt><dd>${esc(val)||'<span class="muted" style="font-weight:400">—</span>'}</dd>`}).join('')}</dl></div>
  <div class="btns" style="margin-top:12px"><button class="btn full" id="editDados">Editar dados</button></div>`;
  $('#editDados').onclick=()=>form({title:'Dados do casamento',fields,rec:c,onSave:x=>{Object.assign(S.config,x);S.config.updatedAt=now();save()}})}

function vSync(v){const c=Sync.cfg||{owner:'',repo:'casamento-dados',branch:'main',token:''};
  v.innerHTML=`<div class="card stack" style="margin-top:6px"><div class="row"><span class="dot ${({ok:'ok',busy:'warn',err:'bad',pend:'warn'}[Sync.state]||'')}"></span><b class="grow">${Sync.cfg?'Sincronização com o GitHub':'Sincronização desligada'}</b></div>
    <div class="small muted">${Sync.cfg?esc(Sync.msg):'Os dados ficam só neste aparelho. Ligue a sincronização para salvar no seu repositório privado e usar no celular e no computador.'}</div>
    ${Sync.cfg?`<div class="btns"><button class="btn sm" id="syncNow">Sincronizar agora</button><button class="btn sec sm" id="syncOff">Desligar</button></div>`:''}</div>
  <h2 class="sec">Configuração</h2>
  <form id="sf" class="card" autocomplete="off">
    <div class="f2"><div class="f"><label for="s_owner">Usuário do GitHub</label><input id="s_owner" value="${esc(c.owner)}" autocapitalize="off" spellcheck="false"></div>
    <div class="f"><label for="s_repo">Repositório de dados</label><input id="s_repo" value="${esc(c.repo)}" autocapitalize="off" spellcheck="false"></div></div>
    <div class="f"><label for="s_branch">Branch</label><input id="s_branch" value="${esc(c.branch||'main')}" autocapitalize="off"></div>
    <div class="f"><label for="s_token">Token (github_pat_…)</label><input id="s_token" type="password" value="${esc(c.token)}" autocapitalize="off" spellcheck="false"></div>
    <div class="btns"><button class="btn" type="submit">Testar e salvar</button></div><div id="sres" class="small" style="margin-top:8px"></div>
  </form>
  <h2 class="sec">Backup</h2>
  <div class="card stack"><div class="small muted">Exporte uma cópia dos dados ou importe um arquivo dados.json. A importação junta o arquivo com o que já está aqui.</div>
   <div class="btns"><button class="btn sec sm" id="exp">Exportar backup</button><label class="btn sec sm" for="imp" style="display:inline-block">Importar arquivo</label><input type="file" id="imp" accept=".json,application/json" hidden></div>
   <div id="expOut"></div></div>
  <h2 class="sec">Aparelho</h2>
  <div class="card stack"><div class="small muted">Apaga os dados guardados neste aparelho. Use só se for configurar de novo puxando do GitHub.</div><div class="btns"><button class="btn danger sm" id="wipe">Apagar dados deste aparelho</button></div><div id="wipeC"></div></div>`;
  $('#sf').onsubmit=async e=>{e.preventDefault();const cfg={owner:$('#s_owner').value.trim(),repo:$('#s_repo').value.trim(),branch:$('#s_branch').value.trim()||'main',token:$('#s_token').value.replace(/\s+/g,''),path:'dados.json'};
    const out=$('#sres');if(!cfg.owner||!cfg.repo||!cfg.token){out.textContent='Preencha usuário, repositório e token.';return}
    out.textContent='Testando…';const old=Sync.cfg;Sync.cfg=cfg;
    try{const r=await Sync.api('');if(r.status===401)throw new Error('Token inválido ou vencido.');if(r.status===404)throw new Error('Repositório não encontrado. Confira o nome e se o token dá acesso a ele.');if(!r.ok)throw new Error('GitHub respondeu '+r.status+'.');
      Sync.saveCfg(cfg);out.innerHTML='<span style="color:var(--ok);font-weight:700">Conectado!</span>';await Sync.run(true)}
    catch(err){Sync.cfg=old;out.innerHTML=`<span style="color:var(--bad)">${esc(/fetch|network|load failed/i.test(err.message)?(/claude\.ai|claudeusercontent/.test(location.hostname)?'Esta é a prévia do Claude, onde a sincronização não funciona. Abra raphaelabarros.github.io/nosso-sim para configurar.':'Não foi possível falar com o GitHub. Confira a internet e se o token foi colado inteiro, sem espaços.'):err.message)}</span>`}};
  if($('#syncNow'))$('#syncNow').onclick=()=>Sync.run(true);
  if($('#syncOff'))$('#syncOff').onclick=()=>{Sync.saveCfg(null);render()};
  $('#exp').onclick=()=>{const txt=JSON.stringify(S,null,1);let ok=false;
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='casamento-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();ok=true}catch(e){}
    $('#expOut').innerHTML=`<div class="small muted">Se o download não começar, copie o texto abaixo e salve como .json.</div><div class="btns"><button class="btn sec sm" id="cpy">Copiar texto</button></div><textarea id="expTxt" style="width:100%;height:90px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:11px" readonly>${esc(txt)}</textarea>`;
    $('#cpy').onclick=()=>{const t=$('#expTxt');navigator.clipboard?.writeText(t.value).then(()=>toast('Copiado'),()=>{t.select();toast('Selecionado. Use copiar.')})||(t.select())}};
  $('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);S=merge(S,d);save();toast('Dados importados');go('inicio')}catch(err){toast('Arquivo inválido')}};rd.readAsText(f)};
  $('#wipe').onclick=()=>{$('#wipeC').innerHTML=`<div class="confirm">Apagar tudo deste aparelho? O que já está no GitHub continua lá.<div class="btns"><button class="btn danger sm" id="w2">Apagar</button><button class="btn sec sm" id="w3">Cancelar</button></div></div>`;
    $('#w2').onclick=()=>{ls.del(KEY);S=normalize(null);render();toast('Dados apagados deste aparelho');if(Sync.cfg)Sync.run()};$('#w3').onclick=()=>$('#wipeC').innerHTML=''}}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-go],[data-item],[data-cv],[data-cke],[data-ec],[data-ep2],[data-el],[data-en],[data-eo]');if(!t)return;const d=t.dataset;
  if(d.tab){go(d.tab);return}
  if(d.go){if(d.fin){sub.fin=d.fin;persistUi()}go(d.go);return}
  if(d.fin){sub.fin=d.fin;persistUi();render();return}
  if(d.fo){sub.forn=d.fo;persistUi();render();return}
  if(d.cf){sub.conv=d.cf;render();return}
  if(d.paypay){const[iid,pid]=d.paypay.split('|');const i=findRec('itens',iid);const p=i&&i.pagamentos.find(x=>x.id===pid);if(p){p.pago=!p.pago;touch(i);save();render();toast(p.pago?'Marcado como pago':'Desmarcado')}return}
  if(d.item){itemSheet(d.item);return}
  if(d.tg){const[k,id]=d.tg.split('|');const r=findRec('convidados',id);r[k]=!r[k];touch(r);save();render();return}
  if(d.rs){const r=findRec('convidados',d.rs);r.rsvp={pendente:'sim',sim:'nao',nao:'pendente'}[r.rsvp||'pendente'];touch(r);save();render();return}
  if(d.cv){convSheet(d.cv);return}
  if(d.ck){const r=findRec('checklist',d.ck);r.status={pendente:'andamento',andamento:'concluido',concluido:'pendente'}[r.status||'pendente'];touch(r);save();render();return}
  if(d.cke){editGeneric('checklist','tarefa',chkFields(),d.cke);return}
  if(t.id==='hideDone'){sub.chkHide=!sub.chkHide;persistUi();render();return}
  if(d.ef){editGeneric('contratados','fornecedor',contrFields,d.ef);return}
  if(d.eo){editGeneric('orcamentos','orçamento',orcFields(),d.eo);return}
  if(d.mv){const[c,id,dir]=d.mv.split('|');moveRec(c,id,+dir);return}
  if(d.ec){editGeneric('cortejo','momento',corFields,d.ec);return}
  if(d.ep2){editGeneric('padrinhos','padrinhos',padFields,d.ep2);return}
  if(d.addc){const c=d.addc;editGeneric(c,c==='cortejo'?'momento':'padrinhos',c==='cortejo'?corFields:padFields,null,{ordem:S[c].length+1,tipo:'Padrinhos'});return}
  if(d.el){const[c,id]=d.el.split('|');editGeneric(c,LUAF[c][0],LUAF[c][1],id);return}
  if(d.addl){editGeneric(d.addl,LUAF[d.addl][0],LUAF[d.addl][1],null);return}
  if(d.lp){const r=findRec('luaCustos',d.lp);r.pago=!r.pago;touch(r);save();render();return}
  if(d.en){editGeneric('notas','anotação',notaFields,d.en);return}
});
$('#fab').onclick=()=>{({financas:()=>itemSheet(null),convidados:()=>convSheet(null),checklist:()=>editGeneric('checklist','tarefa',chkFields(),null,{status:'pendente',grupo:'Geral',ordem:S.checklist.length+1}),
  fornecedores:()=>sub.forn==='contr'?editGeneric('contratados','fornecedor',contrFields,null):editGeneric('orcamentos','orçamento',orcFields(),null),
  cerimonia:()=>editGeneric('cortejo','momento',corFields,null,{ordem:S.cortejo.length+1}),lua:()=>editGeneric('roteiro',LUAF.roteiro[0],LUAF.roteiro[1],null),notas:()=>editGeneric('notas','anotação',notaFields,null)}[route]||(()=>{}))()};
$('#backBtn').onclick=()=>go('mais');
$('#syncBtn').onclick=()=>{if(Sync.cfg&&route==='sync')Sync.run(true);else go('sync')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

const valid=['inicio','financas','convidados','checklist','mais',...MAIS.map(m=>m[0])];
const fromHash=()=>{const h=(location.hash||'').slice(1);return valid.includes(h)?h:null};
window.addEventListener('hashchange',()=>{const h=fromHash();if(h&&h!==route){route=h;render()}});
route=fromHash()||'inicio';
Sync.load();render();
Sync.run();setInterval(()=>{if(document.visibilityState==='visible')Sync.run()},120000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')Sync.run()});window.addEventListener('online',()=>Sync.run());
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>

</body>
</html>
